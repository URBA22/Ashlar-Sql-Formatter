name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and attach the vsix, but do not publish to any marketplace'
        type: boolean
        default: true

permissions:
  contents: write
  # Required for the OIDC token exchanged with Microsoft Entra ID.
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    # Pins the OIDC subject to `repo:<org>/<repo>:environment:marketplace`, which is
    # stable across tags. A branch-scoped federated credential would never match a
    # tag push, and tag subjects cannot be wildcarded. Also the place to add a
    # manual approval gate before anything reaches the Marketplace.
    environment: marketplace
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match package.json version $pkg"
            exit 1
          fi
          echo "Releasing version $pkg"

      - name: Run tests
        run: npm test

      - name: Build style reference page
        run: npm run build

      - name: Package extension
        id: pack
        run: |
          version="$(node -p 'require("./package.json").version')"
          name="$(node -p 'require("./package.json").name')"
          file="$name-$version.vsix"
          npx --yes @vscode/vsce@3 package --out "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      # Secrets/vars cannot be read from a step-level `if:`, so probe them into outputs
      # first. Missing configuration skips the matching publish step rather than
      # failing the release, so tagging works before the identity is wired up.
      - name: Check publishing configuration
        id: cfg
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          entra=false; pat=false; ovsx=false

          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "Dry run requested - skipping all publish steps."
          else
            # Entra ID wins when both are configured: Azure DevOps retires global
            # PATs on 2026-12-01, so the PAT is only ever a stopgap.
            if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_TENANT_ID" ]; then
              entra=true
              echo "Publishing via Microsoft Entra ID (federated)."
            elif [ -n "$VSCE_PAT" ]; then
              pat=true
              echo "::warning::Publishing with a Personal Access Token. Azure DevOps retires global PATs on 2026-12-01 - migrate to Entra ID before then."
            fi
            [ -n "$OVSX_PAT" ] && ovsx=true
          fi

          {
            echo "entra=$entra"
            echo "pat=$pat"
            echo "ovsx=$ovsx"
          } >> "$GITHUB_OUTPUT"

      # Federated (OIDC) sign-in: no client secret is stored. This leaves an Azure CLI
      # session that vsce's --azure-credential picks up via AzureCliCredential.
      - name: Sign in to Microsoft Entra ID
        if: steps.cfg.outputs.entra == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          # The identity is granted no Azure RBAC at all - it only needs to prove
          # its identity to obtain an Azure DevOps token. Without this, az login
          # fails with "No subscriptions found".
          allow-no-subscriptions: true

      - name: Publish to Visual Studio Marketplace (Entra ID)
        if: steps.cfg.outputs.entra == 'true'
        run: |
          npx --yes @vscode/vsce@3 publish \
            --azure-credential \
            --skip-duplicate \
            --packagePath "${{ steps.pack.outputs.file }}"

      - name: Publish to Visual Studio Marketplace (PAT)
        if: steps.cfg.outputs.pat == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          npx --yes @vscode/vsce@3 publish \
            --skip-duplicate \
            --packagePath "${{ steps.pack.outputs.file }}"

      - name: Publish to Open VSX
        if: steps.cfg.outputs.ovsx == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx@0.10 publish "${{ steps.pack.outputs.file }}" -p "$OVSX_PAT"

      - name: Report skipped publishing
        if: steps.cfg.outputs.entra != 'true' && steps.cfg.outputs.pat != 'true' && steps.cfg.outputs.ovsx != 'true'
        run: |
          echo "::notice::No publishing identity configured (or dry run). The vsix is attached to the release only."

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.pack.outputs.file }}" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      - name: Upload vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.file }}
          path: ${{ steps.pack.outputs.file }}
          if-no-files-found: error
