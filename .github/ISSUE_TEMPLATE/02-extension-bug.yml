name: Crash or extension problem
description: An error notification, a command that does nothing, or the Style Reference panel misbehaving.
title: '[bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For output that is merely formatted *wrongly*, please use the
        **Wrong formatting output** template instead — it asks for the right things.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, and what happened instead of what you expected.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a .sql file containing …
        2. Run "SQL Formatter: Open Style Reference"
        3. …
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Errors from the log
      description: >
        **Help** → **Toggle Developer Tools** → **Console**, and the
        **Output** panel with "Log (Extension Host)" selected. Paste anything
        mentioning `tsql-formatter`.
      render: text

  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: '0.1.0'
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: VS Code version and OS
      placeholder: '1.95.0, macOS 15'
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues for this.
          required: true
